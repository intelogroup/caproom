name: ci

on:
  push:
    branches: ['*']
  pull_request:

jobs:
  posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: fmt
        run: cargo fmt --all -- --check || true # advisory until formatted tree-wide

      - name: clippy
        run: cargo clippy --workspace -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: build debug binary
        run: cargo build -p caproom -p caproom-mcp

      - name: watchdog kills a single hog past the cap
        run: |
          set +e
          ./target/debug/caproom run --limit 100 --grace 2 -- node test/hog.js > /tmp/single.log 2>&1
          cat /tmp/single.log
          CODE=$?
          [ "$CODE" -ne 0 ] || { echo "FAIL: hog not capped"; exit 1; }
          sleep 1
          SURV=$(pgrep -f 'Buffer.alloc' | wc -l | tr -d ' ')
          echo "survivors=$SURV"
          [ "$SURV" = "0" ] || { echo "FAIL: orphans survived"; exit 1; }

      - name: watchdog kills the TREE and leaves no orphans
        run: |
          set +e
          # tree total ~270MB across 3 children — cap below that so the TREE breaches
          ./target/debug/caproom run --limit 200 --grace 2 -- node test/tree-hog.js > /tmp/tree.log 2>&1
          cat /tmp/tree.log
          CODE=$?
          [ "$CODE" -ne 0 ] || { echo "FAIL: tree not killed"; exit 1; }
          sleep 1
          SURV=$(pgrep -f 'Buffer.alloc' | wc -l | tr -d ' ')
          [ "$SURV" = "0" ] || { echo "FAIL: orphans survived"; exit 1; }

      - name: stubborn child ignoring SIGTERM still reaped (no orphans)
        run: |
          set +e
          ./target/debug/caproom run --limit 100 --grace 2 -- node test/stubborn-hog.js > /tmp/stubborn.log 2>&1
          cat /tmp/stubborn.log
          [ $? -ne 0 ] || { echo "FAIL: cap not enforced"; exit 1; }
          sleep 1
          SURV=$(pgrep -f 'Buffer.alloc' | wc -l | tr -d ' ')
          echo "survivors=$SURV"
          [ "$SURV" = "0" ] || { echo "FAIL: orphan survived"; exit 1; }

      - name: clean command passes through under the cap
        run: ./target/debug/caproom run --limit 512 -- node -e 'console.log("ok")' | grep -q ok

      - name: top --json emits valid schema-1 output
        run: |
          ./target/debug/caproom top --json | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const j=JSON.parse(s);
              if(j.schema!==1) throw new Error("bad schema");
              if(!Array.isArray(j.processes)) throw new Error("no processes");
              console.log("rows="+j.processes.length);
            });'

      - name: freemem prints a percentage
        run: |
          PCT=$(./target/debug/caproom freemem)
          echo "free=${PCT}%"
          case "$PCT" in ''|*[!0-9]*) echo "FAIL: not numeric"; exit 1;; esac

      - name: park/wake reject invalid pids without signaling
        run: |
          ./target/debug/caproom park 0 && exit 1 || true
          ./target/debug/caproom wake-tree 0 && exit 1 || true
          echo "pid-guards-ok"

      - name: mcp handshake, tool list, unknown tool error object
        run: |
          printf '%s\n%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"bogus","arguments":{}}}' \
            | ./target/debug/caproom-mcp > /tmp/mcp.out
          node -e '
            const lines=require("fs").readFileSync("/tmp/mcp.out","utf8").trim().split("\n").map(JSON.parse);
            const init=lines.find(m=>m.id===1); if(!init||!init.result.serverInfo.name) throw new Error("init failed");
            const tl=lines.find(m=>m.id===2); const names=tl.result.tools.map(t=>t.name);
            for(const t of ["top","park","park_tree","wake","wake_tree","run","freemem","status"])
              if(!names.includes(t)) throw new Error("missing tool "+t);
            const err=lines.find(m=>m.id===3);
            if(!err||!err.error||err.error.code!==-32601) throw new Error("unknown tool must be JSON-RPC error object");
            console.log("mcp-ok:", names.join(","));
          '

      - name: mcp run tool caps a real process end-to-end
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"run","arguments":{"command":["node","test/hog.js"],"limit_mb":400}}}' \
            | ./target/debug/caproom-mcp > /tmp/mcprun.out
          node -e '
            const lines=require("fs").readFileSync("/tmp/mcprun.out","utf8").trim().split("\n").map(JSON.parse);
            const r=lines.find(m=>m.id===4).result.content[0].text;
            const j=JSON.parse(r);
            if(!j.killed_by_cap) { console.error(r); throw new Error("expected cap kill"); }
            console.log("run-cap-ok");
          '

      - name: park-idle gate — idle hog parked, active watcher untouched
        run: CAPROOM_BIN=./target/debug/caproom bash test/park-idle.sh

      - name: sum-OOM gate — parallel hogs all capped, no system OOM
        if: runner.os == 'macos'
        run: CAPROOM_BIN=./target/debug/caproom bash test/sum-oom.sh
