name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.8.0, without v)'
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: caproom-darwin-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            asset: caproom-darwin-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: caproom-linux-x64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            asset: caproom-win32-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build release
        run: cargo build --release --target ${{ matrix.target }} --manifest-path crates/cli/Cargo.toml
        # Note: crates/cli is the binary crate (bin name caproom)
      - name: strip (unix)
        if: matrix.os != 'windows-2022'
        run: strip target/${{ matrix.target }}/release/caproom || true
      - name: stage asset
        shell: bash
        run: |
          mkdir -p prebuilt
          if [[ "${{ matrix.os }}" == "windows-2022" ]]; then
            cp target/${{ matrix.target }}/release/caproom.exe prebuilt/${{ matrix.asset }}
          else
            cp target/${{ matrix.target }}/release/caproom prebuilt/${{ matrix.asset }}
            chmod +x prebuilt/${{ matrix.asset }}
          fi
          ls -lh prebuilt/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: prebuilt/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: prebuilt
          merge-multiple: true
      - name: list prebuilt
        run: ls -R prebuilt && du -sh prebuilt/* 2>/dev/null || true
      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: prebuilt/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: prebuilt
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: stage prebuilt into package
        run: |
          mkdir -p prebuilt
          ls -lh prebuilt/ || true
          # prebuilt/* already present via download; ensure bin/caproom-rs not committed
          rm -f bin/caproom-rs bin/caproom-rs.exe || true
      - name: npm publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  cargo:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish caproom-core
        run: cargo publish -p caproom-core --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: cargo publish caproom-agents
        run: cargo publish -p caproom-agents --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: cargo publish caproom-mcp
        run: cargo publish -p caproom-mcp --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: cargo publish caproom (cli)
        run: cargo publish -p caproom --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  brew:
    needs: release
    runs-on: ubuntu-latest
    if: false # enable after tap exists: intelogroup/homebrew-caproom
    steps:
      - uses: actions/checkout@v4
      - name: bump formula
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          SHA=$(curl -sL https://github.com/intelogroup/caproom/archive/refs/tags/v${VERSION}.tar.gz | shasum -a 256 | cut -d' ' -f1)
          echo "version $VERSION sha $SHA"
          # template: Formula/caproom.rb or homebrew-tap repo
